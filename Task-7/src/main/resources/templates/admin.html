<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>UserCRUD</title>
</head>
<body>

<h1>Список пользователей</h1>

<table border="1">
    <tr>
        <th>Username</th>
        <th>Roles</th>
        <th>First name</th>
        <th>Last name</th>
        <th>Age</th>
        <th>Update</th>
        <th>delete</th>
    </tr>

    <tr th:each="user :${allUsers}">
        <form th:action="@{/admin/user/update}" method="post" style="display: inline">
            <td><input type="text" name="username" th:value="${user.username}"></td>
            <td>
                <div>
                    <div th:each="role : ${allRoles}">
                        <input type="checkbox" th:value="${role.name}" th:checked="${user.roles.contains(role)}" name="roleNames">
                        <span th:text="${role.name}"></span>
                    </div>
                </div>
            </td>
            <td><input type="text" name="firstName" th:value="${user.firstName}"></td>
            <td><input type="text" name="lastName" th:value="${user.lastName}"></td>
            <td><input type="number" name="age" th:value="${user.age}"></td>
            <input type="hidden" name="id" th:value="${user.id}">
            <td><button type="submit">Обновить</button></td>
        </form>
        <td style="text-align: center">
            <form th:action="@{/admin/user/delete}" method="post" style="display: inline">
                <input type="hidden" name="id" th:value="${user.id}">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
</table>

<h1>Форма создания пользователя</h1>
<form th:action="@{/admin/user/create}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <input type="text" name="username" placeholder="Логин">
    <input type="password" name="password" placeholder="Пароль">
    <div>
        <label>Роли:</label>
        <div th:each="role : ${allRoles}">
            <input type="checkbox" th:value="${role.name}" name="roleNames">
            <span th:text="${role.name}"></span>
        </div>
    </div>
    <input type="text" name="firstName" placeholder="Имя">
    <input type="text" name="lastName" placeholder="Фамилия">
    <input type="number" name="age" placeholder="Возраст">
    <button type="submit">Создать пользователя</button>
</form>

<label>Выйти</label>
<form th:action="@{/logout}" method="post" style="display: inline">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit"></button>
</form>
</body>
</html>
